name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, format, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nivra
          POSTGRES_PASSWORD: nivra
          POSTGRES_DB: nivra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nivra -d nivra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NIVRA_TEST_DATABASE_URL: postgres://nivra:nivra@127.0.0.1:5432/nivra_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      # internal/webui embeds the built web interface; the placeholder in the repo is enough to compile.
      - name: go vet
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...
      - name: gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal ./database ./tests)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go test
        run: go test -count=1 -p 1 ./...

  python:
    name: Python (lightweight AI tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements*.txt
      # ai/tests/conftest.py imports torch, so the CPU build is installed; only fast, model-free tests run.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ai/requirements.txt pytest
      - name: pytest (subset)
        env:
          NIVRA_THREADS: "2"
        run: |
          python -m pytest -q \
            ai/tests/test_exec_protocol.py \
            ai/tests/test_longvideo.py \
            ai/tests/test_te_archive.py \
            ai/tests/test_hd_budget.py
          # Added by the executor hardening work; run only when present.
          for t in ai/tests/test_exec_worker_fixes.py ai/tests/test_exec_schemas.py; do
            if [ -f "$t" ]; then python -m pytest -q "$t"; fi
          done

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # "build" runs tsc first (see web/package.json).
      - run: npm run build
